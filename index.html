<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กองทุน 30 บาทแก๊งเรา</title>
    <!-- Tailwind CSS สำหรับจัดหน้า -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen py-8">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 m-4">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">🎯 กองทุนแก๊ง 30 บาท/วัน</h1>
        <p class="text-xs text-slate-400 text-center mb-4">เริ่ม 3 ส.ค. 69 - 1 ธ.ค. 70 (ซิงค์เรียลไทม์)</p>

        <!-- 💰 กล่องยอดสะสมรวมทั้งหมดตั้งแต่วันแรก -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-4 mb-4 text-white shadow-md">
            <p class="text-xs text-emerald-100 font-medium">ยอดสะสมรวมทั้งหมด (ตั้งแต่เริ่มเก็บ)</p>
            <p id="grandTotal" class="text-3xl font-bold mt-1">0 บาท</p>
            <p id="totalDaysCount" class="text-xs text-emerald-100 mt-1">กำลังคำนวณ...</p>
        </div>

        <!-- เลือกวันที่ -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-600 mb-1">เลือกวันที่เช็คยอด:</label>
            <input type="date" id="selectDate" min="2026-08-03" max="2027-12-01" 
                class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-700">
        </div>

        <!-- ยอดรวมของวันนั้น -->
        <div class="bg-indigo-50 rounded-xl p-4 mb-6 flex justify-between items-center">
            <div>
                <p class="text-xs text-indigo-500 font-medium">ยอดของวันนี้ที่เลือก</p>
                <p id="dailyTotal" class="text-xl font-bold text-indigo-700">0 บาท</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-indigo-500 font-medium">จ่ายแล้ว</p>
                <p id="paidCount" class="text-xl font-bold text-indigo-700">0 / 5 คน</p>
            </div>
        </div>

        <!-- รายชื่อสมาชิก -->
        <div id="memberList" class="space-y-3">
            <!-- JavaScript จะเรนเดอร์รายชื่อตรงนี้ -->
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAmk4nh3AaNX7z2TEmc2pS8-JIEA48A_rk",
            authDomain: "hlhsu-ce6d4.firebaseapp.com",
            projectId: "hlhsu-ce6d4",
            storageBucket: "hlhsu-ce6d4.firebasestorage.app",
            messagingSenderId: "366980332732",
            appId: "1:366980332732:web:dba3466911dc176bd824b9",
            measurementId: "G-65M71EFH8Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const members = ["Pe", "Zonya", "Ped", "Maynie", "Nj"];
        const dateInput = document.getElementById("selectDate");
        const memberListEl = document.getElementById("memberList");
        const dailyTotalEl = document.getElementById("dailyTotal");
        const paidCountEl = document.getElementById("paidCount");
        const grandTotalEl = document.getElementById("grandTotal");
        const totalDaysCountEl = document.getElementById("totalDaysCount");

        // ตั้งค่าวันที่เริ่มต้นเป็นวันนี้ (หรือ 2026-08-03 ถ้ามาก่อนหน้านั้น)
        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.value = (todayStr >= "2026-08-03" && todayStr <= "2027-12-01") ? todayStr : "2026-08-03";

        let unsubscribeDaily = null;
        let unsubscribeAll = null;

        // 1. โหลดข้อมูลรายวันแบบ Real-time ตามวันที่เลือก
        function loadDataForDate(dateStr) {
            if (unsubscribeDaily) unsubscribeDaily();

            const docRef = doc(db, "daily_records", dateStr);

            unsubscribeDaily = onSnapshot(docRef, (docSnap) => {
                let data = docSnap.exists() ? docSnap.data().payments || {} : {};
                renderUI(data, dateStr);
            });
        }

        // 2. คำนวณยอดรวมทั้งหมดจากทุกวันใน Database (สะสมตั้งแต่เริ่ม)
        function listenGrandTotal() {
            const colRef = collection(db, "daily_records");
            
            unsubscribeAll = onSnapshot(colRef, (snapshot) => {
                let grandTotal = 0;
                let totalPaidPeopleCount = 0;

                snapshot.forEach((doc) => {
                    const payments = doc.data().payments || {};
                    Object.values(payments).forEach(isPaid => {
                        if (isPaid) {
                            grandTotal += 30;
                            totalPaidPeopleCount++;
                        }
                    });
                });

                grandTotalEl.innerText = `${grandTotal.toLocaleString()} บาท`;
                totalDaysCountEl.innerText = `เก็บครบแล้ว ${totalPaidPeopleCount} ครั้ง (จากสมาชิก 5 คน)`;
            });
        }

        // เรนเดอร์หน้าจอ HTML รายวัน
        function renderUI(paymentsData, dateStr) {
            memberListEl.innerHTML = "";
            let paidCount = 0;

            members.forEach(name => {
                const isPaid = !!paymentsData[name];
                if (isPaid) paidCount++;

                const div = document.createElement("div");
                div.className = "flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-xl transition";
                div.innerHTML = `
                    <span class="font-medium text-slate-700">${name} <span class="text-xs text-slate-400 font-normal">(30.-)</span></span>
                    <button class="px-4 py-2 rounded-lg text-sm font-semibold transition ${
                        isPaid 
                        ? 'bg-emerald-500 text-white shadow-sm shadow-emerald-200' 
                        : 'bg-slate-200 text-slate-600 hover:bg-slate-300'
                    }">
                        ${isPaid ? 'จ่ายแล้ว ✓' : 'ยังไม่จ่าย'}
                    </button>
                `;

                // กดปุ่มเพื่อสลับสถานะ และบันทึกลง Firebase ทันที
                div.querySelector("button").addEventListener("click", async () => {
                    const newStatus = !isPaid;
                    paymentsData[name] = newStatus;

                    try {
                        await setDoc(doc(db, "daily_records", dateStr), { payments: paymentsData }, { merge: true });
                    } catch (e) {
                        console.error("Error saving: ", e);
                    }
                });

                memberListEl.appendChild(div);
            });

            dailyTotalEl.innerText = `${paidCount * 30} บาท`;
            paidCountEl.innerText = `${paidCount} / 5 คน`;
        }

        // เมื่อเปลี่ยนวันที่ในปฏิทิน
        dateInput.addEventListener("change", (e) => {
            loadDataForDate(e.target.value);
        });

        // เริ่มต้นทำงานเมื่อเปิดเว็บ
        loadDataForDate(dateInput.value);
        listenGrandTotal();
    </script>
</body>
</html>
